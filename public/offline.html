<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F14" />
    <title>SVC is offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0b0f14;
        color: #f2f5f8;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 390px);
        border: 1px solid rgba(255,255,255,.11);
        border-radius: 28px;
        padding: 28px;
        background: rgba(20,24,32,.92);
        box-shadow: 0 24px 80px rgba(1,4,10,.55), inset 0 1px 0 rgba(255,255,255,.1);
      }
      .mark {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border: 1px solid rgba(96,165,250,.22);
        border-radius: 16px;
        background: rgba(96,165,250,.12);
        color: #bfdbfe;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: .08em;
      }
      p { margin: 0; }
      h1 { margin: 20px 0 9px; font-size: 20px; letter-spacing: -.025em; }
      .copy { color: rgba(203,213,225,.7); font-size: 14px; line-height: 1.55; }
      button {
        width: 100%;
        margin-top: 24px;
        padding: 12px 16px;
        border: 1px solid rgba(147,197,253,.2);
        border-radius: 16px;
        background: #60a5fa;
        color: #07101d;
        font: inherit;
        font-size: 14px;
        font-weight: 750;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">SVC</div>
      <h1>You’re offline</h1>
      <p class="copy">SVC needs a connection to refresh messages and workspace data. Reconnect, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
